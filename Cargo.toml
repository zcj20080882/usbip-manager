[package]
name = "usbip-manager"
version = "0.1.0"
edition = "2024"

[dependencies]
regex = "1.11.1"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
slint = "1.12.0"
tracing = "0.1.41"
tracing-appender = "0.2.3"
tracing-subscriber = {version = "0.3.19", features = ["env-filter"]}
windows-elevate = "0.1.0"
winreg = "0.55.0"

[build-dependencies]
slint-build = "1.12.0"
embed-resource = "3.0.4"
